<html>
<head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body>
    <main>
        <figure class="matrix">
            <img class="matrix__image" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix-diagram">
            <figcaption class="matrix__caption">
            <a class="matrix__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
            </figcaption>
        </figure>

        <section class="todo">
            <div id="todo__add" id="add-item">
                <label class="todo__label" for="new-task">Add Item</label>
                <div class="todo__row">
                    <input id="new-task"class="todo__input" type="text">
                    <button class="todo__button">Add</button>
                </div>
            </div>

            <h3 class="todo__title">Todo</h3>
            <ul class="todo__list todo__list--incomplete" id="incomplete-tasks">
                <li class="todo__item">
                    <input type="checkbox" class="todo__checkbox">
                    <label class="todo__text">Pay Bills</label>
                    <input type="text" class="todo__input">
                    <button class="todo__edit">Edit</button>
                    <button class="todo__delete">
                        <img src="./remove.svg" alt="remove-img">
                    </button>
                </li>
                <li class="todo__item todo__item--edit">
                    <input type="checkbox" class="todo__checkbox">
                    <label class="todo__text">Go Shopping</label>
                    <input type="text" value="Go Shopping" class="task" aria-colspan="todo__input">
                    <button class="todo__save">Save</button>
                    <button class="todo__delete">
                        <img src="./remove.svg" alt="remove-img">
                    </button>
                </li>
            </ul>

            <h3 class="todo__title">Completed</h3>
            <ul id="todo__list todo__list--completed" id="completed-tasks">
                <li class="todo__item">
                    <input type="checkbox" checked class="todo__checkbox">
                    <label class="todo__text">See the Doctor</label>
                    <input type="text" class="todo__input">
                    <button class="todo__edit">Edit</button>
                    <button class="todo__delete">
                        <img src="./remove.svg" alt="remove-img">
                    </button>
                </li>
            </ul>
        </section>         
    </main>

    <script src="app.js"></script>
</body>
</html>
